name: Sanatana Vahini - Colab Linked Auto Upload

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  auto-colab-job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies (auto fix)
        run: |
          ls -la
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f requirement.txt ]; then
            pip install -r requirement.txt
          else
            pip install google-generativeai edge-tts moviepy pandas nest-asyncio google-api-python-client google-auth requests
          fi

      - name: Run Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          echo "⏰ GitHub waking up Colab job"
          ls -la
          if [ -f bot.py ]; then
            python bot.py
          elif [ -f Bot.py ]; then
            python Bot.py
          else
            ls -la *.py
            python *.py
          fi

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanatana-video-${{ github.run_number }}
          path: |
            *.mp4
            *.mp3
